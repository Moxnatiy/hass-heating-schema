<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heating Schema dev bench</title>
  <style>
    :root {
      --primary-color: #03a9f4; --primary-text-color: #e1e1e1; --secondary-text-color: #9e9e9e;
      --primary-background-color: #111; --card-background-color: #1c1c1c; --secondary-background-color: #282828;
      --divider-color: rgba(225, 225, 225, 0.12); --app-header-background-color: #1c1c1c; --app-header-text-color: #e1e1e1;
      --success-color: #43a047; --error-color: #e53935; --warning-color: #ffa000;
    }
    :root.light {
      --primary-text-color: #212121; --secondary-text-color: #727272; --primary-background-color: #fafafa;
      --card-background-color: #fff; --secondary-background-color: #f0f0f0; --divider-color: rgba(0, 0, 0, 0.12);
      --app-header-background-color: #03a9f4; --app-header-text-color: #fff;
    }
    html, body { margin: 0; height: 100%; font-family: Roboto, system-ui, sans-serif; background: var(--primary-background-color); }
    heating-schema-panel { height: 100vh; }
  </style>
</head>
<body>
  <heating-schema-panel></heating-schema-panel>
  <script type="module" src="./bench.js"></script>

</html>
